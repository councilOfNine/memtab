name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `node --test` has changed how it interprets positional arguments between
        # majors, so the supported range is actually exercised rather than assumed.
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Lint (manifest, load order, doc links)
        run: npm run lint

      - name: Unit tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build distributable
        run: npm run build

      - name: Check the build is reproducible
        run: |
          mv dist/memtab-*.zip /tmp/first.zip
          npm run build
          if ! cmp -s /tmp/first.zip dist/memtab-*.zip; then
            echo "::error::Two builds of the same commit produced different bytes."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: memtab-unpacked
          path: dist/memtab/
