name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `node --test` changed how it interprets positional arguments between majors,
        # so the whole supported range is exercised rather than assumed. Node 20 is not
        # here on purpose: it went end-of-life in April 2026, and it predates glob
        # support in `node --test`, so `test/**/*.test.js` is read as a literal path.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Lint (manifest, load order, doc links)
        run: npm run lint

      - name: Unit tests
        run: npm test

  # Loads the real extension into a real Chrome over the DevTools Protocol and checks
  # it actually works. This is the only job that can catch the failures that matter
  # most — a favicon that never applies, a service worker that throws on startup — and
  # they are exactly what a store reviewer would reject for.
  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Browser smoke test
        run: npm run test:e2e

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build distributable
        run: npm run build

      - name: Build the marketing site
        run: npm run build:site

      - name: Check the build is reproducible
        run: |
          mv dist/memtab-*.zip /tmp/first.zip
          npm run build
          if ! cmp -s /tmp/first.zip dist/memtab-*.zip; then
            echo "::error::Two builds of the same commit produced different bytes."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: memtab-unpacked
          path: dist/memtab/

      - uses: actions/upload-artifact@v4
        with:
          name: memtab-site
          path: dist/site/
