name: Deploy site

# Merging a PR into main is a push to main, so that is the only trigger needed — the
# deploy runs once, after the merge, not twice (once for the PR and once for the merge).
#
# `paths` keeps a docs-only or extension-only commit from redeploying an unchanged site.
# The workflow file itself is included so a change to this pipeline is exercised by the
# commit that makes it.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/icons/**'
      - 'src/shared/**'
      - 'scripts/build-site.mjs'
      - 'scripts/lib/plan-to-svg.mjs'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-site.yml'
  # For redeploying without an empty commit — after a Cloudflare cache purge, say.
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race to the same domain. A queued run waits for the one in
# flight rather than cancelling it, so main and the live site can't end up disagreeing.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://memtab.fixit.works
    steps:
      - uses: actions/checkout@v4

      # Deliberately not a silent skip. A deploy pipeline that quietly does nothing when
      # it is misconfigured is worse than one that fails, because `main` and the live
      # site drift with nothing to show for it.
      - name: Check the Cloudflare credentials are present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [ -n "$TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings -> Secrets and variables -> Actions. See docs/DEPLOY.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The site is generated from the extension's own renderer and its CSP is generated
      # from the built HTML, so a broken source here means a broken deploy. Gating on the
      # full check is the difference between this and a plain Git-connected build, which
      # would publish whatever the branch happens to contain.
      - name: Check
        run: npm run lint && npm test

      - name: Build
        run: npm run build:site

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Checks the live response, not the build output: that every inline script the page
      # actually serves is named by the CSP it actually serves. A marker that never got
      # substituted, a relaxed script-src, or HTML and headers from different builds all
      # fail here rather than in front of a visitor.
      - name: Verify what actually went live
        run: node scripts/verify-deploy.mjs https://memtab.fixit.works/
