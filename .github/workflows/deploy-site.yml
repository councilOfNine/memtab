name: Deploy site

# Pushing to master deploys memtab.fixit.works.
#
# This is the only thing that deploys. Cloudflare's own Git integration would also work
# and needs no secrets, but it deploys whatever lands on the branch with no notion of the
# test suite — and the site is generated from the extension's real renderer, so a commit
# that breaks `render.plan()` produces a broken page. Gating on lint and tests first is
# the whole reason this lives in Actions. If the Git integration is ever reconnected,
# delete this file: two deploy paths race and double every push.
on:
  push:
    branches: [master]
    # Nothing else changes what gets served, so a docs-only or extension-only push
    # doesn't redeploy an identical page.
    paths:
      - 'site/**'
      - 'src/icons/**'
      - 'src/shared/**'
      - 'scripts/build-site.mjs'
      - 'scripts/verify-deploy.mjs'
      - 'scripts/lib/plan-to-svg.mjs'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-site.yml'
  # Redeploying without an empty commit — after a cache purge, or to re-run the verify.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and queued rather than cancelled: cancelling mid-deploy could
# leave master and the live site disagreeing with nothing to show for it.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://memtab.fixit.works
    steps:
      - uses: actions/checkout@v4

      # Deliberately not a silent skip. A deploy pipeline that quietly does nothing when
      # it is misconfigured is worse than one that fails, because master and the live
      # site drift with nothing to show for it.
      - name: Check the Cloudflare credentials are present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [ -n "$TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings -> Secrets and variables -> Actions. See docs/DEPLOY.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check
        run: npm run lint && npm test

      - name: Build
        run: npm run build:site

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Checks the live response rather than the build output: that the deploy landed,
      # and that every inline script the page serves is named by the CSP it serves. Those
      # two artifacts come from different build steps and can drift, and the symptom is a
      # script silently refused in a browser — which nothing else would catch.
      - name: Verify what actually went live
        run: |
          node scripts/verify-deploy.mjs https://memtab.fixit.works/ \
            --expect-built dist/site/index.html \
            --wait 120
