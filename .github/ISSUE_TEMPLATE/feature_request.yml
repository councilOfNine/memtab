name: Feature request
description: Suggest an idea for MemTab
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. What were you doing when you wanted this?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like MemTab to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried, or alternatives you considered?
