<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MemTab — marquee promo tile 1400x560</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Chrome Web Store marquee promo tile. Optional; required to be eligible for the
         store homepage carousel. Exactly 1400x560. -->
    <div class="frame frame--marquee frame--dark">
      <div class="split">
        <div>
          <div class="wordmark">
            <img src="icons/icon-48.png" alt="" width="38" height="38" />
            MemTab
          </div>
          <h1 style="margin-top: 22px">Which tab is eating<br />your memory?</h1>
          <p class="sub">
            A traffic light on every tab's favicon, with thresholds and colours you choose.
          </p>
          <p class="footnote" style="margin-top: 26px">
            Open source · No tracking · No network requests
          </p>
        </div>

        <div class="strip strip--dark">
          <div class="strip__row strip__row--fill">
            <div class="tab tab--muted">
              <canvas data-icon="ok:ring:D"></canvas>
              <span>Docs</span>
            </div>
            <div class="tab tab--muted">
              <canvas data-icon="ok:ring:G"></canvas>
              <span>Mail</span>
            </div>
            <div class="tab">
              <canvas data-icon="warn:ring:A"></canvas>
              <span>Analytics</span>
            </div>
            <div class="tab">
              <canvas data-icon="high:ring:E"></canvas>
              <span>Editor</span>
            </div>
          </div>
          <div class="strip__body"></div>
        </div>
      </div>
    </div>

    <script src="shared/constants.js"></script>
    <script src="shared/format.js"></script>
    <script src="shared/palette.js"></script>
    <script src="shared/settings.js"></script>
    <script src="shared/levels.js"></script>
    <script src="shared/measure.js"></script>
    <script src="shared/render.js"></script>
    <script src="frames.js"></script>
  </body>
</html>
